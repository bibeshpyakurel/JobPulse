name: CodeQL

# Static analysis on every change to main, on pull requests, and weekly so a
# newly published rule finds old code without waiting for the next commit.
# The analysis itself lives in bibeshpyakurel/github-workflows; the triggers
# and the schedule stay here so this repository's cadence is visible here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

# Least privilege: the analysis reads the tree and writes findings, nothing else.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    uses: bibeshpyakurel/github-workflows/.github/workflows/codeql-reusable.yml@main
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      languages: '["python"]'
